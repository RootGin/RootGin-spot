<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="shard-snow-title shard-snow-desc">
  <title id="shard-snow-title">RootGin Interlocking Shard Snowflake - Upscaled</title>
  <desc id="shard-snow-desc">An upscaled version of the heavy geometric snowflake logo built from six merging crystalline branches using the Nord theme palette.</desc>
  
  <rect width="512" height="512" rx="128" fill="#2E3440" />

  <g transform="translate(256, 256) scale(1.28)">
    
    <g transform="rotate(0)">
      <polygon points="0,0 -30,-52 -30,-110 0,-145 30,-110 30,-52" fill="#88C0D0" />
      <polygon points="0,0 0,-145 30,-110 30,-52" fill="#8FBCBB" opacity="0.6" /> 
    </g>
    
    <g transform="rotate(60)">
      <polygon points="0,0 -30,-52 -30,-110 0,-145 30,-110 30,-52" fill="#5E81AC" />
    </g>
    
    <g transform="rotate(120)">
      <polygon points="0,0 -30,-52 -30,-110 0,-145 30,-110 30,-52" fill="#81A1C1" />
    </g>
    
    <g transform="rotate(180)">
      <polygon points="0,0 -30,-52 -30,-110 0,-145 30,-110 30,-52" fill="#88C0D0" />
      <polygon points="0,0 0,-145 30,-110 30,-52" fill="#8FBCBB" opacity="0.6" />
    </g>
    
    <g transform="rotate(240)">
      <polygon points="0,0 -30,-52 -30,-110 0,-145 30,-110 30,-52" fill="#5E81AC" />
    </g>
    
    <g transform="rotate(300)">
      <polygon points="0,0 -30,-52 -30,-110 0,-145 30,-110 30,-52" fill="#81A1C1" />
    </g>
    
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#ECEFF4" />
    <polygon points="0,-22 19,-11 19,11 0,22 0,0" fill="#4C566A" opacity="0.2" />

  </g>
</svg>
